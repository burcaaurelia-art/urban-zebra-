<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 700" role="img" aria-labelledby="title description">
  <title id="title">Cele mai bune hoteluri din lume în 2026</title>
  <desc id="description">Grafică editorială negru și auriu pentru clasamentul hotelurilor din 2026</desc>
  <defs>
    <linearGradient id="gold" x1="0" x2="1">
      <stop offset="0" stop-color="#8d6a16"/>
      <stop offset=".5" stop-color="#f2d675"/>
      <stop offset="1" stop-color="#b98b24"/>
    </linearGradient>
    <radialGradient id="glow">
      <stop offset="0" stop-color="#d4af37" stop-opacity=".2"/>
      <stop offset="1" stop-color="#0a0a0a" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="1200" height="700" fill="#090909"/>
  <circle cx="960" cy="130" r="360" fill="url(#glow)"/>
  <path d="M780 540V250h260v290M740 540h350M830 250v-70h160v70M845 320h50v60h-50zm80 0h50v60h-50zm-80 100h50v60h-50zm80 0h50v60h-50z" fill="none" stroke="url(#gold)" stroke-width="12"/>
  <text x="90" y="165" fill="#d4af37" font-family="Arial, sans-serif" font-size="28" font-weight="700" letter-spacing="6">CLASAMENT INTERNAȚIONAL</text>
  <text x="90" y="270" fill="#fff" font-family="Arial, sans-serif" font-size="72" font-weight="700">Cele mai bune</text>
  <text x="90" y="355" fill="#fff" font-family="Arial, sans-serif" font-size="72" font-weight="700">hoteluri din lume</text>
  <text x="90" y="470" fill="url(#gold)" font-family="Arial, sans-serif" font-size="112" font-weight="800">2026</text>
  <text x="95" y="570" fill="#c7c7c7" font-family="Arial, sans-serif" font-size="28">Top 5 și premiile care contează</text>
  <line x1="90" y1="610" x2="1110" y2="610" stroke="#d4af37" stroke-opacity=".4"/>
  <text x="90" y="655" fill="#fff" font-family="Arial, sans-serif" font-size="24" font-weight="700">Urban<tspan fill="#d4af37">.Zebra</tspan></text>
</svg>
